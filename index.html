<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إلى ملوكتي ❤️</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
background:radial-gradient(circle at top,#9b2454,#260714 60%,#070207);
color:#fff;
font-family:Tahoma,Arial,sans-serif;
overflow-x:hidden
}

.card{
width:min(94vw,540px);
padding:22px;
background:#ffffff12;
border:1px solid #ffffff28;
border-radius:30px;
backdrop-filter:blur(15px);
box-shadow:0 25px 80px #000b;
text-align:center
}

.heart{
font-size:72px;
animation:pulse 1.1s infinite
}

@keyframes pulse{
50%{transform:scale(1.18)}
}

h1{
font-size:31px;
margin:8px 0 12px
}

input{
width:100%;
padding:15px;
border-radius:15px;
border:1px solid #ffffff30;
background:#ffffff14;
color:#fff;
text-align:center;
font-size:18px;
outline:none
}

button{
margin-top:14px;
padding:14px 24px;
border:0;
border-radius:15px;
background:#ff477e;
color:#fff;
font-weight:bold;
font-size:17px
}

#error{
display:none;
color:#ffb7cd
}

#page{
display:none
}

.photo{
width:100%;
display:block;
margin:16px 0 18px;
border-radius:23px;
box-shadow:0 12px 35px #0008
}

.msg{
padding:19px;
border-radius:22px;
background:#ffffff10;
border:1px solid #ffffff20;
font-size:19px;
line-height:2.05;
text-align:right
}

.music{
margin-top:20px;
padding:15px;
border-radius:22px;
background:#ffffff10;
border:1px solid #ffffff20
}

.music h2{
margin:3px 0 12px;
font-size:20px
}

iframe{
width:100%;
height:90px;
border:0;
border-radius:15px
}

.float{
position:fixed;
bottom:-40px;
pointer-events:none;
animation:up linear forwards
}

@keyframes up{
to{
transform:translateY(-115vh);
opacity:0
}
}
</style>
</head>

<body>

<!-- شاشة الباسورد -->

<div class="card" id="lock">

<div class="heart">🔐❤️</div>

<h1>رسالة خاصة ليكي</h1>

<p>في حاجة حلوة مستنياكي جوّه 💌</p>

<input
id="pass"
type="password"
placeholder="اكتبي الباسورد">

<br>

<button onclick="openMsg()">
افتحي الرسالة ❤️
</button>

<p id="error">
الباسورد غلط 😅
</p>

</div>


<!-- الصفحة بعد الباسورد -->

<div class="card" id="page">

<div class="heart">❤️</div>

<h1>إلى ملوكتي ❤️</h1>

<p>من قلبي ليكي… 🌍</p>


<!-- الصورة مدمجة داخل الموقع -->

<img
class="photo"
src="data:image/jpeg;base64,ضع_بيانات_الصورة_هنا"
alt="صورتنا ❤️">


<!-- الرسالة -->

<div class="msg">

انا بحبك اوي يملوكتي وبجد بحبك جدا ومقدرش اعيش من غيرك
ويحد انا عاوزك وم هبعد عنك ومتزعليش مني وسمحيني بحد
انا بحبك اووووووووي ❤️🌍

</div>


<!-- الأغنية داخل الموقع -->

<div class="music">

<h2>🎵 أغنيتنا ❤️</h2>

<iframe
src="https://www.youtube.com/embed/Qql25KzCDbk"
title="TUL8TE"
allow="autoplay; encrypted-media; picture-in-picture"
allowfullscreen>
</iframe>

</div>

</div>


<script>

function openMsg(){

let pass =
document.getElementById("pass")
.value.trim()
.toLowerCase();

if(pass==="love"){

document.getElementById("lock")
.style.display="none";

document.getElementById("page")
.style.display="block";

setInterval(function(){

let h=document.createElement("div");

h.className="float";

h.textContent=
["❤️","💕","💗","💖","💘"]
[Math.floor(Math.random()*5)];

h.style.left=
Math.random()*100+"vw";

h.style.fontSize=
(20+Math.random()*28)+"px";

h.style.animationDuration=
(5+Math.random()*5)+"s";

document.body.appendChild(h);

setTimeout(function(){
h.remove();
},10000);

},450);

}else{

document.getElementById("error")
.style.display="block";

}

}

</script>

</body>
</html>
