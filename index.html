<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إلى ملكوتي ❤️</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
padding:20px;background:radial-gradient(circle,#8d204b,#260714 60%,#070207);
color:white;font-family:Tahoma,Arial;overflow:hidden
}
.card{
width:min(94vw,520px);padding:25px 20px;text-align:center;
background:#ffffff12;border:1px solid #ffffff25;border-radius:30px;
backdrop-filter:blur(15px);box-shadow:0 25px 80px #000b
}
.heart{font-size:75px;animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.2)}}
h1{font-size:31px}
input{
width:100%;padding:16px;border-radius:15px;border:1px solid #ffffff25;
background:#ffffff15;color:white;text-align:center;font-size:18px
}
button,.song{
display:inline-block;margin-top:14px;padding:14px 22px;border:0;
border-radius:15px;background:#ff477e;color:white;font-weight:bold;
text-decoration:none;font-size:16px
}
#error{display:none;color:#ffb0c8}
#page{display:none}
.msg{
margin-top:18px;padding:20px;border-radius:22px;
background:#ffffff10;border:1px solid #ffffff20;
font-size:19px;line-height:2.1;text-align:right
}
.float{
position:fixed;bottom:-40px;animation:up linear forwards
}
@keyframes up{
to{transform:translateY(-115vh);opacity:0}
}
</style>
</head>

<body>

<div class="card" id="lock">
<div class="heart">🔐❤️</div>
<h1>رسالة خاصة ليكي</h1>
<p>في حاجة حلوة مستنياكي جوّه 💌</p>

<input id="pass" type="password" placeholder="اكتبي الباسورد">

<br>
<button onclick="openMsg()">افتحي الرسالة ❤️</button>

<p id="error">الباسورد غلط 😅</p>
</div>


<div class="card" id="page">

<div class="heart">❤️</div>

<h1>إلى ملكوتي ❤️</h1>
<p>من قلبي ليكي… 🌍</p>

<div style="font-size:90px;margin:15px">📸</div>

<div class="msg">
انا بحبك اوي يملوكتي وبجد بحبك جدا ومقدرش اعيش من غيرك
ويحد انا عاوزك وم هبعد عنك ومتزعليش مني وسمحيني بحد
انا بحبك اووووووووي ❤️🌍
</div>

<a class="song"
href="https://www.youtube.com/results?search_query=TUL8TE+%D9%85%D9%84%D9%8A%D8%B4+%D8%A5%D9%84%D8%A7+%D8%B9%D9%8A%D9%86%D9%8A%D9%83"
target="_blank">
🎵 شغّلي أغنيتنا
</a>

</div>


<script>
function openMsg(){

let pass=document.getElementById("pass").value.trim().toLowerCase();

if(pass==="love"){

document.getElementById("lock").style.display="none";
document.getElementById("page").style.display="block";

setInterval(function(){

let h=document.createElement("div");

h.className="float";
h.textContent=["❤️","💕","💗","💖"][Math.floor(Math.random()*4)];

h.style.left=Math.random()*100+"vw";
h.style.fontSize=(20+Math.random()*25)+"px";
h.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(h);

setTimeout(function(){h.remove()},10000);

},450);

}else{

document.getElementById("error").style.display="block";

}
}
</script>

</body>
</html>
